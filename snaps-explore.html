}
:root[data-theme="dark"]{
  --page:#0b0b0b;--card:#131313;--text:#a3a3a3;--strong:#e6e6e6;--muted:#6e6e6e;--faint:#262626;--line:#3e3e3e;
  --btn:#1b1b1b;--btn-on-bg:#e6e6e6;--btn-on-fg:#0b0b0b;

*{box-sizing:border-box}

.l3-card{position:absolute;right:56px;top:10px;width:min(340px,calc(100% - 80px));max-height:calc(100% - 64px);overflow:auto;background:var(--overlay);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:10px;box-shadow:var(--lift);padding:12px 14px 12px;font-size:13px;line-height:1.5;color:var(--text);z-index:2}

.l3-card .compact{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:8px 0 2px;font:12px/1.4 var(--mono)}

.l3-card .live{font:12px/1.4 var(--mono);color:var(--strong);padding:6px 8px;border-radius:6px;background:color-mix(in srgb,var(--strong) 6%,transparent);margin:6px 0 8px}
.l3-card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.l3-card .body p{margin:8px 0}

.l3-card[data-collapsed] .body{display:none}
.l3-card .asmh{font:10.5px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 4px}
.l3-card ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.l3 .l3-card ol button{all:unset;box-sizing:border-box;display:flex;gap:8px;width:100%;padding:4px 6px;border-radius:5px;font:12px/1.35 var(--sans);color:var(--text);cursor:pointer}
.l3 .l3-card ol button b{font:500 11px/1.6 var(--mono);color:var(--muted);flex:none}
.l3 .l3-card ol button:hover,.l3 .l3-card ol button[data-hot]{background:color-mix(in srgb,var(--strong) 8%,transparent);color:var(--strong)}
.l3 .l3-card ol button[aria-pressed="true"]{background:var(--btn-on-bg);color:var(--btn-on-fg)}

.l3-follow{position:absolute;left:12px;bottom:10px;padding:8px 12px;border-radius:8px;background:var(--overlay);box-shadow:var(--lift);font:12px/1.45 var(--mono);color:var(--text);pointer-events:none;max-width:calc(100% - 24px)}
.l3-follow b{display:block;color:var(--strong);font-weight:normal;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.l3-follow i{font-style:normal;color:var(--muted)}
.l3-joy{position:absolute;left:18px;bottom:18px;width:116px;height:116px;border-radius:50%;background:var(--overlay);box-shadow:var(--lift);touch-action:none}
.l3-joy-knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--strong);opacity:.75}
.l3-walkhint{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);font:11.5px/1.4 var(--mono);background:var(--overlay);padding:5px 12px;border-radius:999px;box-shadow:var(--lift);color:var(--text);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.l3-loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:var(--page);z-index:5;transition:opacity .45s}
.l3-loading[data-state="ready"]{opacity:0;pointer-events:none}
.l3-loading[hidden]{display:none}
.l3-loading-card{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;text-align:center}
.l3-loading-bar{width:160px;height:2px;border-radius:2px;background:var(--faint);overflow:hidden;position:relative}
.l3-loading-bar i{position:absolute;left:-40%;top:0;bottom:0;width:40%;background:var(--strong);animation:l3bar 1.4s ease-in-out infinite}
@keyframes l3bar{to{left:100%}}
.l3-loading-text{font:13px/1.5 var(--sans);color:var(--strong)}
.l3-loading-sub{font:10.5px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.l3-loading[data-state="error"] .l3-loading-bar{display:none}
.l3-loading[data-state="error"] .l3-loading-text{color:var(--text)}
.l3-loading[data-state="error"] .l3-loading-card::before{content:"";width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted);background:linear-gradient(var(--muted),var(--muted)) 50% 28%/1.5px 7px no-repeat,linear-gradient(var(--muted),var(--muted)) 50% 74%/1.5px 1.5px no-repeat}
@media (prefers-reduced-motion: reduce){.l3-loading-bar i{animation:none;left:30%}.l3-lab,.l3-loading{transition:none}}
.l3-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.l3-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font:10.5px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.l3-load{margin:12px 0 0;font:12px/1.5 var(--mono);color:var(--text);overflow-x:auto}
.l3-load table{border-collapse:collapse;width:100%;min-width:520px}

.l3-load td{padding:5px 10px 5px 0;border-bottom:1px solid var(--faint);vertical-align:top}
.l3-load td.n{text-align:right;font-variant-numeric:tabular-nums}
.l3-load .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:-1px}
.dot[data-load="ok"]{background:var(--green)}.dot[data-load="busy"]{background:var(--amber)}.dot[data-load="limit"]{background:var(--red)}.dot[data-load="none"]{background:var(--faint)}
.l3-load p{margin:8px 0 0;color:var(--muted)}
.l3-load strong{color:var(--strong);font-weight:normal}
.l3-legend{display:flex;flex-direction:column;gap:8px;margin:14px 2px 0;font-size:13px;line-height:1.55;color:var(--text)}
.l3-keys{display:flex;flex-wrap:wrap;gap:6px 22px}
.l3-key{display:inline-flex;align-items:baseline;gap:8px}
.l3-key i{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none;transform:translateY(1px)}
.k-steel{background:linear-gradient(135deg,#d7dade,#8f949a)}
.k-can{background:linear-gradient(90deg,#17191d 0 60%,#5078b0 60%)}
.k-load{background:linear-gradient(90deg,var(--green) 0 33%,var(--amber) 33% 66%,var(--red) 66%)}
.l3-caption{color:var(--text)}
/* expanded: the scene fills the window (fullscreen API or fixed overlay fallback) */
.l3-view:fullscreen,.l3-view.l3-expanded{background:var(--page);display:flex;flex-direction:column;width:100%;height:100%;padding:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-sizing:border-box}
.l3-view.l3-expanded{position:fixed;inset:0;z-index:2147483000}
.l3-view:fullscreen .l3-stage,.l3-view.l3-expanded .l3-stage{flex:1;aspect-ratio:auto;height:auto;max-height:none;min-height:0}

.l3-manual .l3-lab,.l3-manual .l3-loading{transition:none}
/* ===== Pulsar 351 additions ===== */

.l3-stations button[aria-pressed="true"] i{color:inherit;opacity:.7}

.sn-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sn-tabs{display:flex;gap:4px;margin:4px 0 8px}
.l3 .sn-tabs button[aria-selected="true"]{color:var(--btn-on-fg);background:var(--btn-on-bg)}
.sn-bom{overflow-x:auto;-webkit-overflow-scrolling:touch}

.l3 .sn-steps ol button{all:unset;box-sizing:border-box;display:flex;gap:8px;width:100%;padding:4px 6px;border-radius:5px;font:12px/1.35 var(--sans);color:var(--text);cursor:pointer}

      <span class="l3-key"><i class="k-load" style="background:linear-gradient(90deg,#3d7fd6 0 50%,#cfe3ee 50%)"></i>Blue modular belt; clear polycarbonate guards and the glass cover</span>
    </span>
    <span class="l3-caption">The Easysnap Pulsar 351 as GrowTopia runs it for Growtopia Snaps, in 3D. The bottom film comes off a 351 mm reel over the dancer arm, and each cycle the pouch die cutter forms one row of packs across the web, 4 to 8 lanes. The filler doses every lane at once from the 316L pressure tank through the dosing pump. The pre-printed top film is laid on and sealed by the servo-driven seal head, the heat transfer printer stamps a lot and date code into each pack's window, the precut scores the snap line, the knife cuts the row free and the pick &amp; place sets it on the blue outfeed belt. Easysnap rates the Pulsar at up to 40 cycles a minute, 320 packs a minute on 8 lanes. Orbit round it, pick any of Easysnap's 11 numbered components, follow one pack from film to belt, or take the machine apart into its 16 assemblies and open any one for its assembly sheet: every part with quantity, material, what it does and how it fastens, and a step-by-step rebuild. Easysnap does not publish dimensions or a parts list, so sizes are estimated from its photos against the 351 mm reel (±15%) and the sheets show typical construction; confirm part numbers and torques with the Easysnap manual. Flavor colours are placeholders until GrowTopia's artwork is in hand.</span>

<script type="module">
const Mod = (() => {
// Easysnap Pulsar 351 process model. Pure: used by the build (geometry) and inlined into the page (motion).
// World units are centimetres: x along the machine front (left to right), y into the machine (front y = 0), z up.

// Published facts (Easysnap): one 351 mm reel width for every pack size, 4 to 8 lanes, up to 40 cycles/min,
// up to 320 packs/min on 8 lanes, 0.1 to 30 ml per pack, a 351 x 100 mm thermal transfer print frame.
const FACTS = { reel: 35.1, maxCpm: 40, maxLanes: 8, printFrame: [35.1, 10] };

// The web: 351 mm wide, running left to right at the process level in front of the back plate.
const WEB = { y0: 22, y1: 57.1, w: 35.1, z: 100, t: 0.3 };
WEB.yc = (WEB.y0 + WEB.y1) / 2;
// One index moves the web one tool pitch (the 100 mm print frame plus the gap between rows).
const PITCH = 10.6;
// Rows are formed by the die and then dwell at X.die + m·PITCH. Every tool sits on a whole number of pitches.
const M = { fill: 2, seal: [5, 6], print: 9, precut: 11, cut: 12.5, pick: 13 };
const X = { infeed: 26, die: 45, layon: 87.1, end: 45 + 12.5 * PITCH };
X.fill = X.die + M.fill * PITCH;
X.print = X.die + M.print * PITCH;
X.precut = X.die + M.precut * PITCH;
X.knife = X.die + M.cut * PITCH;
X.pick = X.die + M.pick * PITCH;
X.seal = [X.die + M.seal[0] * PITCH, X.die + M.seal[1] * PITCH];

// Outfeed conveyor: the pick & place sets each row down across the belt, which carries it out to the right.
const CONV = { y: -29.95, z: 89, x0: 114, x1: 282, fadeFrom: 266, y0: -52, y1: -7.9 };
const PP = { dy: CONV.y - WEB.yc, dz: CONV.z - (WEB.z + WEB.t), lift: 3.2 };

// Pack length by fill (the tooling pitch stays at 10.6 cm; a bigger dose makes a longer, fuller pack).
const FILLS = {
  5: { L: 6.2, bulge: 0.32, name: "5 ml" },
  10: { L: 7.6, bulge: 0.42, name: "10 ml" },
  30: { L: 9.6, bulge: 0.62, name: "30 ml" },
};
const LANES = [4, 6, 8];
const RATES = [20, 30, 40];

// Phases inside one cycle (fractions of the period).
const PH = { index: [0, 0.34], die: [0.4, 0.74], fill: [0.42, 0.86], seal: [0.4, 0.8], print: [0.46, 0.74], precut: [0.46, 0.7], knife: [0.42, 0.58], pick: 0.62 };

const smooth = (a, b, x) => {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};
// Smootherstep: zero velocity and acceleration at both ends, for the web index and the pick & place.
const ease = (a, b, x) => {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * t * (t * (t * 6 - 15) + 10);
};
// A stroke that goes down and comes back: 0 at rest, 1 at the bottom, held flat in the middle.
const stroke = (a, b, x, hold = 0.35) => {
  const m = (b - a) * (1 - hold) * 0.5;
  return ease(a, a + m, x) * (1 - ease(b - m, b, x));
};

function makeModel({ lanes = 8, cpm = 40, fill = 10 } = {}) {
  const T = 60 / cpm;
  const F = FILLS[fill] ?? FILLS[10];
  const laneP = WEB.w / lanes;
  const packW = laneP - Math.max(0.5, laneP * 0.09);
  const laneY = Array.from({ length: lanes }, (_, i) => WEB.y0 + laneP * (i + 0.5));
  // Belt speed: rows land one period apart, about 1.5 pack lengths between them.
  const beltV = (PITCH * 1.25) / T;

  const cycleOf = (t) => Math.floor(t / T);
  const phaseOf = (t) => t / T - Math.floor(t / T);
  // Web position in pitches: whole cycles plus the eased index.
  const shift = (t) => cycleOf(t) + ease(PH.index[0], PH.index[1], phaseOf(t));

  // Where a row formed in cycle k is, and what has happened to it.
  function rowAt(k, t) {
    const n = cycleOf(t);
    const u = phaseOf(t);
    if (n < k || (n === k && u < 0.6)) return null;
    const j = shift(t) - k; // pitches travelled since the die
    const at = (m) => j > m + 1e-6 || (Math.round(j) === m && n - k === m);
    const dwellAt = (m) => n - k === m && u >= PH.index[1];
    const r = { k, j, x: X.die + j * PITCH, y: 0, z: WEB.z, where: "web", fill: 0, covered: false, sealed: false, printed: 0, scored: 0, cut: false, dose: false };
    r.fill = j > M.fill + 0.01 ? 1 : dwellAt(M.fill) ? smooth(PH.fill[0] + 0.05, PH.fill[1] - 0.02, u) : 0;
    r.dose = dwellAt(M.fill) && u > PH.fill[0] + 0.04 && u < PH.fill[1] - 0.02;
    r.covered = r.x > X.layon;
    r.sealed = j > M.seal[0] + 0.5 || (dwellAt(M.seal[0]) && u > 0.6);
    r.printed = j > M.print + 0.01 ? 1 : dwellAt(M.print) ? smooth(0.56, 0.66, u) : 0;
    r.scored = j > M.precut + 0.01 ? 1 : dwellAt(M.precut) ? smooth(0.54, 0.6, u) : 0;
    r.cut = j > M.cut + 0.01 && (j > M.pick + 0.01 || (n - k >= M.pick && u >= 0.5));
    void at;
    // Picked at the pick position, carried and set down on the belt.
    const tPick = (k + M.pick) * T + PH.pick * T;
    if (t >= tPick) {
      const s = t - tPick;
      const carry = carryOf(s / T);
      if (carry.onBelt) {
        const tDown = s - carry.downAt * T;
        r.where = "belt";
        r.x = X.pick + beltV * tDown;
        r.y = PP.dy;
        r.z = CONV.z;
        r.fade = r.x > CONV.fadeFrom ? Math.max(0, 1 - (r.x - CONV.fadeFrom) / (CONV.x1 - 1.5 - CONV.fadeFrom)) : 1;
        if (r.x > CONV.x1 - 1.5) return null;
      } else {
        r.where = "pp";
        r.x = X.pick;
        r.y = carry.dy;
        r.z = WEB.z + WEB.t + carry.dz;
        r.held = true;
      }
      r.cut = true;
    }
    return r;
  }

  // The pick & place, as a function of the time since it gripped a row (in periods).
  // 0..0.10 lift, 0.10..0.42 travel out, 0.42..0.52 set down, release; then return empty.
  function carryOf(v) {
    const lift = PP.lift;
    if (v < 0.1) return { dy: 0, dz: ease(0, 0.1, v) * lift, onBelt: false };
    if (v < 0.42) return { dy: PP.dy * ease(0.1, 0.42, v), dz: lift + (PP.dz - lift + 1.2) * ease(0.1, 0.42, v) * 0.6, onBelt: false };
    if (v < 0.52) {
      const a = lift + (PP.dz - lift + 1.2) * 0.6;
      return { dy: PP.dy, dz: a + (PP.dz - a) * ease(0.42, 0.52, v), onBelt: false };
    }
    return { dy: PP.dy, dz: PP.dz, onBelt: true, downAt: 0.52 };
  }

  // The head, independent of whether it holds a row: offsets from its rest pose above the pick plate.
  function headAt(t) {
    const u = phaseOf(t);
    // dz is measured from "cups touching the row" (the row's own plane); dy from the pick position.
    const v = u >= PH.pick ? u - PH.pick : u + 1 - PH.pick;
    if (v < 0.52) {
      const c = carryOf(v);
      return { dy: c.dy, dz: c.dz, grip: true };
    }
    if (v < 0.58) return { dy: PP.dy, dz: PP.dz + ease(0.52, 0.58, v) * 3, grip: false, belt: true };
    if (v < 0.86) {
      const e = ease(0.58, 0.86, v);
      return { dy: PP.dy * (1 - e), dz: PP.dz + 3 + (2.4 - PP.dz - 3) * e, grip: false };
    }
    return { dy: 0, dz: 2.4 * (1 - ease(0.86, 0.96, v)), grip: v > 0.97 };
  }

  // Tool strokes this instant (0 open, 1 closed) and reel/spool travel.
  function toolsAt(t) {
    const u = phaseOf(t);
    return {
      die: stroke(PH.die[0], PH.die[1], u),
      fill: stroke(PH.fill[0], PH.fill[1], u, 0.6),
      seal: stroke(PH.seal[0], PH.seal[1], u),
      print: stroke(PH.print[0], PH.print[1], u),
      precut: stroke(PH.precut[0], PH.precut[1], u),
      knife: stroke(PH.knife[0], PH.knife[1], u, 0.1),
      indexing: u < PH.index[1],
      web: shift(t) * PITCH, // cm of web pulled since t = 0

function roundedRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);

  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
// The pre-printed Growtopia Snaps face (u along the pack, v across): green, flavor band, the mark, the code window.
function drawPackFace(g, W0, H0, { code, score, big }) {
  const fl = flavorOf();
  g.fillStyle = "#2f6b3a";
  g.fillRect(0, 0, W0, H0);
  const band = W0 * 0.22;
  g.fillStyle = fl.color;
  g.fillRect(W0 - band, 0, band, H0);
  if (logoImg.naturalWidth) {
    const lw = Math.min(H0 * 0.72, W0 * 0.42);
    const lh = (lw * logoImg.naturalHeight) / logoImg.naturalWidth;
    // the mark reads across the pack (the pack's width is its short side)
    g.save();
    g.translate(W0 * 0.56, H0 / 2);
    g.rotate(-Math.PI / 2);
    g.drawImage(logoImg, -lw / 2, -lh / 2, lw, lh);
    g.restore();
  }
  // uncoated window for the lot and date code
  const wx = W0 * 0.06;
  const ww = W0 * 0.16;
  g.fillStyle = "rgba(246,246,240,.92)";
  roundedRect(g, wx, H0 * 0.14, ww, H0 * 0.72, 4);
  g.fill();
  if (code) {
    g.save();
    g.translate(wx + ww / 2, H0 / 2);
    g.rotate(-Math.PI / 2);
    g.fillStyle = "#16171a";
    g.textAlign = "center";
    g.font = `600 ${Math.round(ww * 0.34)}px ui-monospace,Menlo,monospace`;
    g.fillText(`LOT ${LOT}`, 0, -ww * 0.06);
    g.font = `${Math.round(ww * 0.3)}px ui-monospace,Menlo,monospace`;
    g.fillText(DATE, 0, ww * 0.3);
    g.restore();
  }
  if (big) {
    g.save();
    g.translate(W0 * 0.37, H0 / 2);
    g.rotate(-Math.PI / 2);
    g.fillStyle = "rgba(255,255,255,.92)";
    g.textAlign = "center";
    g.font = `700 ${Math.round(H0 * 0.11)}px ui-sans-serif,system-ui,sans-serif`;
    g.fillText("GROWTOPIA", 0, 0);
    g.font = `500 ${Math.round(H0 * 0.07)}px ui-sans-serif,system-ui,sans-serif`;

    perf.slow = 0;
    resize();
  } else if (perf.fast >= 5 && dpr < DPR) {
    dpr = Math.min(DPR, +(dpr + 0.25).toFixed(2));
    perf.fast = 0;
    resize();
  }
}
let screenClock = 0;
let frames = 0;
let fpsT = 0;
function step(dt, now, draw = true) {
  if (playing && !xp.on) simT += dt;
  stepTour(dt, now);
  stepExplode(Math.min(dt, 0.05));
  asmTick(dt);
  hero.step(dt);
  if (fly) {
    fly.t += dt;
    const u = easeIO(clamp01(fly.t / fly.dur));
    camera.position.lerpVectors(fly.p0, fly.p1, u);
    controls.target.lerpVectors(fly.t0, fly.t1, u);
    if (fly.t >= fly.dur) fly = null;
  }
  const { tools } = updatePacks();
  moveParts(tools);
  if (follow.on) trackFollow(dt, now);
  controls.update();
  clampScene();
  processHover(now);
  screenClock += dt;
  if (screenClock > 0.25) {
    screenClock = 0;
    drawScreen();
    showReadout();
  }
  if (!draw) return;
  renderer.render(scene, camera);
  hero.render();
  updateLabels();
  frames++;
  fpsT += dt;
  if (fpsT > 1) {
    statsEl.textContent = `${(frames / fpsT).toFixed(0)} fps · ${renderer.info.render.calls} draws · ${(renderer.info.render.triangles / 1000).toFixed(0)}k tris · ${dpr}× pixels`;
    frames = 0;
    fpsT = 0;
  }
}
let last = 0;
let raf = 0;
let visible = true;
function tick(now) {
  const raw = (now - (last || now)) / 1000;
  last = now;
  step(Math.min(0.1, raw), now);
  if (raw > 0 && raw < 5) adaptDpr(raw);
  raf = visible ? requestAnimationFrame(tick) : 0;
}

/* ---------------- deep links (same as the 2D page) + embed ---------------- */
const ALIAS = { tank: "fill", filler: "fill", filling: "fill", conveyor: "outfeed", pickplace: "outfeed", "pick-place": "outfeed", door: "guards", printing: "printer", dosing: "pump", bottomfilm: "bottom", topfilm: "top", panel: "hmi", sealing: "seal", glass: "cover" };
function applyHash() {
  const h = decodeURIComponent(location.hash || "").slice(1).toLowerCase().replace(/(^|&)embed(&|$)/, "").replace(/^&|&$/g, "");
  if (!h) return;
  const mm = h.match(/^(iso|assemble|apart)-([a-z-]+)$/);
  const id = mm ? (D.iso[mm[2]] ? mm[2] : ALIAS[mm[2]]) : null;
  if (h === "apart") {
    if (xp.iso) isoLeave();
    else if (!xp.on) openExplode();
  } else if (h === "parts") {
    if (!xp.on) openExplode();
    if (xp.iso) isoLeave(true);
    panelIndex();
  } else if (mm && id && (mm[1] === "iso" || mm[1] === "apart")) openIso(id);
  else if (mm && id && mm[1] === "assemble") openIso(id, true);
  else if (h === "follow") {
    if (!follow.on) startFollow();
  } else if (h === "snap") hero.snap();
  else return;
  holdTour = true;
  stopTour();
  if (h !== "snap" && h !== "follow" && !EMBED) stage.scrollIntoView?.({ block: "center" });
}
addEventListener("hashchange", applyHash);

/* ---------------- init ---------------- */
pickTheme();
applyLanes();
buildPacks();
applyMaterials();
camera.aspect = Math.max(0.5, stage.clientWidth / Math.max(1, stage.clientHeight));
{
  const d = homeDist();
  camera.position.copy(tv(sph(HOME_T, -118, 24, d)));
  controls.target.copy(tv(HOME_T));
}
controls.update();
resize();
updatePacks();
drawScreen();
showReadout();
syncButtons();
syncChips();
hero.draw(-1);
if (EMBED) {
  controls.autoRotate = !reduced.matches;
  controls.autoRotateSpeed = 0.35;
  figureWanted = qs.has("figure");
}
loadText.textContent = "Starting the machine…";
function ready() {
  window.__snReady = true;
  loadingEl.setAttribute("data-state", "ready");
  setTimeout(() => (loadingEl.hidden = true), MANUAL ? 0 : 500);
  announce("3D Pulsar ready");
}
applyHash();
if (MANUAL) {
  root.classList.add("l3-manual");
  manualNow = performance.now();
  idleSince = qs.has("tour") ? -1e9 : manualNow;
  step(1 / 30, manualNow);
  ready();
} else {
  raf = requestAnimationFrame(tick);
  requestAnimationFrame(() => requestAnimationFrame(ready));
  new IntersectionObserver((entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible && !raf) {
      last = 0;
      raf = requestAnimationFrame(tick);
    }
  }).observe(stage);
}

/* ---------------- debug + capture API ---------------- */
window.__sn = {
  D,
  get m() {
    return m;
  },
  OPT,
  advance(dt = 1 / 30, n = 1) {
    for (let i = 0; i < n; i++) {
      manualNow += dt * 1000;
      step(dt, manualNow, i === n - 1);
    }
    return simT;
  },
  home: () => flyHome(0.01),
  comp: (id) => focusComp(id),
  apart: (on = true) => (on ? openExplode() : closeExplode()),
  iso: (id, assemble = false) => openIso(id, assemble),
  isoBack: () => isoLeave(),
  step: (k) => asmGo(k),
  hoverSub: (id) => {
    focus.hoverSub = id;
    syncSubRows();
    applyMaterials();
  },
  hoverComp: (id) => {
    focus.hoverComp = id;
    applyMaterials();
    showReadout();
  },
  follow: (on = true) => (on ? startFollow() : stopFollow()),
  snap: () => hero.snap(),
  configure(o) {
    Object.assign(OPT, o);
    configure(new Set(Object.keys(o)));
  },
  camera(pos, tgt) {
    fly = null;
    camera.position.copy(tv(pos));
    controls.target.copy(tv(tgt));
    controls.update();
  },
  cam: () => ({ p: camera.position.toArray().map((v) => +v.toFixed(3)), t: controls.target.toArray().map((v) => +v.toFixed(3)), d: +camera.position.distanceTo(controls.target).toFixed(3), aspect: +camera.aspect.toFixed(3), fly: !!fly }),
  expand: (on = true) => setExpanded(on),
  figure(on) {
    figureWanted = on;
    syncButtons();
  },
  stats: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, meshes: allMeshes.length, dpr }),
  get simT() {
    return simT;
  },
  set playing(v) {
    setPlaying(v);
  },
  bbox,
  MACHINE,
  tourOn: () => tour.on,
  user: () => user(),
};

</script></body></html>
